name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (core + UI)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # The build reads Firebase config from env. Real secrets are not needed
      # to verify that the bundle compiles, so CI supplies placeholders.
      - name: Build web UI
        run: npm run build:ui
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ciplaceholder'
          VITE_FIREBASE_DATABASE_URL: https://ci-placeholder.firebaseio.com

  rules:
    name: Firebase security rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The Realtime Database emulator runs on the JVM. firebase-tools requires
      # JDK 21 or newer and fails at startup on anything older.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Pinned to a major version: an unpinned install silently picks up new
      # requirements (v15 raised the minimum JDK to 21) and breaks CI on a day
      # nothing in this repo changed.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Test security rules
        run: npm run test:rules

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the runtime declared in functions/package.json engines
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions
